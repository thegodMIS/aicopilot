<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mentor Group — Sales Dashboard</title>
<style>
:root{--bg:#050912;--panel:#0b1220;--border:rgba(255,255,255,.08);--text:#e8edf5;--muted:#8290a8;--aqua:#00d4aa;--green:#20d17a;--gold:#f5c518;--blue:#4d9fff;--red:#ff5570}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,rgba(0,212,170,.07),transparent 30%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border);background:rgba(7,13,24,.96)}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#00d4aa,#008a78);color:#00110d}.title{font-size:16px;font-weight:800}.sub{font-size:10px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--text);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:700}.btn-primary{background:var(--aqua);color:#00110d;border-color:var(--aqua)}.page{max-width:1450px;margin:auto;padding:28px}.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:20px}.h1{font-size:27px;font-weight:900}.hint{font-size:11px;color:var(--muted);margin-top:6px}.status{font-size:11px;color:var(--aqua)}.error{display:none;background:rgba(255,85,112,.08);border:1px solid rgba(255,85,112,.3);border-radius:10px;padding:14px;color:#ff9aaa;white-space:pre-wrap;margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.card{background:rgba(11,18,32,.93);border:1px solid var(--border);border-radius:14px;padding:20px}.label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.value{font-size:33px;font-weight:900;margin-top:10px}.aqua{color:var(--aqua)}.green{color:var(--green)}.gold{color:var(--gold)}.blue{color:var(--blue)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}.panel{background:rgba(11,18,32,.93);border:1px solid var(--border);border-radius:14px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.panel-title{font-size:13px;font-weight:800}.meta{font-size:10px;color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.04);text-align:left;font-size:11px}th{font-size:9px;color:var(--muted);text-transform:uppercase}.agent{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.04)}.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,212,170,.1);color:var(--aqua);font-weight:900}.agentbody{flex:1}.agentname{font-weight:800;font-size:12px}.agentmeta{font-size:9px;color:var(--muted);margin-top:3px}.rate{font-weight:900;color:var(--aqua);font-size:15px}.empty,.loading{padding:45px;text-align:center;color:var(--muted);font-size:11px}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.stats{grid-template-columns:1fr}.page{padding:16px}.nav{padding:0 14px}}
</style>
</head>
<body>
<nav class="nav"><div class="brand"><div class="logo">🎯</div><div><div class="title">Mentor Group</div><div class="sub">Sales Call Intelligence Dashboard</div></div></div><button class="btn btn-primary" onclick="location.href='/'">⚡ New Call</button></nav>
<main class="page">
  <div class="head"><div><div class="h1">Sales Dashboard</div><div class="hint">Live performance from Mentor Group Calls Log</div></div><div id="serverStatus" class="status">Loading…</div></div>
  <div id="errorBox" class="error"></div>
  <section class="stats"><div class="card"><div class="label">Total Calls</div><div id="totalCalls" class="value aqua">—</div></div><div class="card"><div class="label">Conversions</div><div id="totalConversions" class="value green">—</div></div><div class="card"><div class="label">Conversion Rate</div><div id="conversionRate" class="value gold">—</div></div><div class="card"><div class="label">Average Score</div><div id="avgScore" class="value blue">—</div></div></section>
  <section class="grid">
    <div class="panel"><div class="panel-head"><div class="panel-title">📞 Recent Calls</div><div id="callMeta" class="meta">—</div></div><div id="callsBody" class="loading">Loading calls…</div></div>
    <div class="panel"><div class="panel-head"><div class="panel-title">👥 Team Performance</div></div><div id="agentBody"><div class="loading">Loading team…</div></div></div>
  </section>
</main>
<script>
const API='/api/copilot';
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function showError(m){const e=document.getElementById('errorBox');e.textContent=m;e.style.display='block';document.getElementById('serverStatus').textContent='Error';}
async function load(){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'getDashboard'})});const text=await r.text();let data;try{data=JSON.parse(text);}catch(e){throw new Error('Dashboard API returned invalid JSON. '+text.slice(0,300));}if(!r.ok||!data.success)throw new Error(data.error||'Dashboard API failed.');render(data);document.getElementById('serverStatus').textContent='Connected ✓';}catch(e){showError(e.message);}}
function render(data){const s=data.stats||{};document.getElementById('totalCalls').textContent=s.totalCalls??0;document.getElementById('totalConversions').textContent=s.totalConversions??0;document.getElementById('conversionRate').textContent=(s.convRate??'0')+'%';document.getElementById('avgScore').textContent=s.avgScore??'—';renderCalls(s.recentCalls||[]);renderAgents(data.agentStats||[]);}
function renderCalls(calls){const body=document.getElementById('callsBody');document.getElementById('callMeta').textContent=calls.length+' recent';if(!calls.length){body.innerHTML='<div class="empty">No calls have been logged yet.</div>';return;}let h='<div class="tablewrap"><table><thead><tr><th>Call ID</th><th>Agent</th><th>Client</th><th>Date</th><th>Duration</th><th>Conversion</th><th>Score</th></tr></thead><tbody>';calls.forEach(c=>{const d=Number(c['Duration (sec)'])||0;h+='<tr><td>'+esc(c['Call ID'])+'</td><td>'+esc(c['Agent Name'])+'</td><td>'+esc(c['Client Name'])+'</td><td>'+esc(c['Date'])+'</td><td>'+Math.floor(d/60)+':'+String(d%60).padStart(2,'0')+'</td><td>'+esc(c['Conversion']||'No')+'</td><td>'+esc(c['Score']||0)+'</td></tr>';});body.innerHTML=h+'</tbody></table></div>';}
function renderAgents(agents){const body=document.getElementById('agentBody');if(!agents.length){body.innerHTML='<div class="empty">No team data available.</div>';return;}body.innerHTML=agents.map(a=>'<div class="agent"><div class="avatar">'+esc((a.name||'?').charAt(0).toUpperCase())+'</div><div class="agentbody"><div class="agentname">'+esc(a.name)+'</div><div class="agentmeta">'+a.calls+' calls · '+a.conversions+' conversions · Avg score '+esc(a.averageScore)+'</div></div><div><div class="rate">'+esc(a.conversionRate)+'%</div><div class="agentmeta">conversion</div></div></div>').join('');}
load();setInterval(load,60000);
</script>
</body>
</html>
