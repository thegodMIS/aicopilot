<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor Group — Sales Dashboard</title>
<style>
:root{--bg:#050912;--panel:#0b1220;--border:rgba(255,255,255,.08);--text:#e8edf5;--muted:#8290a8;--aqua:#00d4aa;--green:#20d17a;--gold:#f5c518;--blue:#4d9fff;--red:#ff5570}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,rgba(0,212,170,.07),transparent 30%),var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.nav{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(7,13,24,.97);border-bottom:1px solid var(--border)}.brand{display:flex;gap:11px;align-items:center}.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#00d4aa,#008a78);color:#00110d}.title{font-size:15px;font-weight:800}.sub{font-size:10px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);padding:10px 15px;border-radius:8px;font-weight:700;cursor:pointer}.btn.primary{background:var(--aqua);color:#00110d;border-color:var(--aqua)}.page{max-width:1380px;margin:auto;padding:30px}.head{margin-bottom:24px}.head h1{font-size:27px;margin:0}.head p{color:var(--muted);font-size:12px}.status{font-size:11px;color:var(--aqua)}.error{display:none;background:rgba(255,85,112,.08);border:1px solid rgba(255,85,112,.3);color:#ff9aaa;padding:14px;border-radius:10px;margin-bottom:18px;white-space:pre-wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}.stat{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:22px}.label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.value{font-size:34px;font-weight:900;margin-top:10px}.aqua{color:var(--aqua)}.green{color:var(--green)}.gold{color:var(--gold)}.blue{color:var(--blue)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:20px}.panel{background:rgba(11,18,32,.92);border:1px solid var(--border);border-radius:14px;overflow:hidden}.panelhead{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase}.agent{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid rgba(255,255,255,.04)}.avatar{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:rgba(0,212,170,.1);color:var(--aqua);font-weight:900}.info{flex:1}.name{font-size:13px;font-weight:800}.meta{color:var(--muted);font-size:10px;margin-top:4px}.rate{text-align:right}.rate strong{color:var(--aqua);font-size:17px}.empty,.loading{text-align:center;padding:45px;color:var(--muted);font-size:12px}.spin{width:26px;height:26px;border:3px solid rgba(0,212,170,.12);border-top-color:var(--aqua);border-radius:50%;margin:0 auto 12px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.page{padding:18px}.stats{grid-template-columns:1fr}.sub{display:none}}
</style></head><body>
<nav class="nav"><div class="brand"><div class="logo">🎯</div><div><div class="title">Mentor Group</div><div class="sub">Sales Call Assistant · AI Coaching</div></div></div><button class="btn primary" onclick="startNewCall()">⚡ Start New Call</button></nav>
<main class="page"><div class="head"><h1>Sales Dashboard</h1><p>Live Mentor Group Sales Division data</p><div id="status" class="status">Connecting...</div></div><div id="error" class="error"></div>
<div class="stats"><div class="stat"><div class="label">Total Calls</div><div id="totalCalls" class="value aqua">—</div></div><div class="stat"><div class="label">Conversions</div><div id="totalConversions" class="value green">—</div></div><div class="stat"><div class="label">Conversion Rate</div><div id="convRate" class="value gold">—</div></div><div class="stat"><div class="label">Average Score</div><div id="avgScore" class="value blue">—</div></div></div>
<div class="grid"><section class="panel"><div class="panelhead"><strong>📞 Recent Calls</strong><span id="callMeta" class="meta">—</span></div><div id="calls"><div class="loading"><div class="spin"></div>Loading calls...</div></div></section><section class="panel"><div class="panelhead"><strong>👥 Team Performance</strong></div><div id="agents"><div class="loading"><div class="spin"></div>Loading team...</div></div></section></div></main>
<script>
const API_ENDPOINT='/api/copilot';
function showError(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block';document.getElementById('status').textContent='Error';document.getElementById('status').style.color='var(--red)';}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function startNewCall(){window.location.href='/';}
async function load(){try{const r=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'getDashboard'})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'Dashboard API failed.');render(d);}catch(e){showError('Dashboard could not load:\n\n'+e.message);}}
function render(d){document.getElementById('error').style.display='none';document.getElementById('status').textContent='Connected ✓';document.getElementById('totalCalls').textContent=d.stats?.totalCalls??0;document.getElementById('totalConversions').textContent=d.stats?.totalConversions??0;document.getElementById('convRate').textContent=(d.stats?.convRate??'0')+'%';document.getElementById('avgScore').textContent=d.stats?.avgScore??'—';renderCalls(d.stats?.recentCalls||[]);renderAgents(d.agentStats||[]);}
function renderCalls(calls){document.getElementById('callMeta').textContent=calls.length+' recent';const box=document.getElementById('calls');if(!calls.length){box.innerHTML='<div class="empty">No calls have been logged yet.</div>';return;}let h='<div class="tablewrap"><table><thead><tr><th>Call ID</th><th>Agent</th><th>Client</th><th>Date</th><th>Duration</th><th>Conversion</th><th>Score</th></tr></thead><tbody>';calls.forEach(c=>{const dur=Number(c['Duration (sec)'])||0;h+='<tr><td>'+escapeHtml(c['Call ID']||'—')+'</td><td>'+escapeHtml(c['Agent Name']||'—')+'</td><td>'+escapeHtml(c['Client Name']||'—')+'</td><td>'+escapeHtml(c['Date']||'—')+'</td><td>'+Math.floor(dur/60)+':'+String(dur%60).padStart(2,'0')+'</td><td>'+escapeHtml(c['Conversion']||'No')+'</td><td>'+escapeHtml(c['Score']||'0')+'</td></tr>';});h+='</tbody></table></div>';box.innerHTML=h;}
function renderAgents(agents){const box=document.getElementById('agents');if(!agents.length){box.innerHTML='<div class="empty">No team data available.</div>';return;}box.innerHTML=agents.map(a=>'<div class="agent"><div class="avatar">'+escapeHtml((a.name||'?').charAt(0).toUpperCase())+'</div><div class="info"><div class="name">'+escapeHtml(a.name||'Unknown')+'</div><div class="meta">'+a.calls+' calls · '+a.conversions+' conversions · Avg score '+escapeHtml(a.averageScore)+'</div></div><div class="rate"><strong>'+escapeHtml(a.conversionRate)+'%</strong><div class="meta">conversion</div></div></div>').join('');}
load();
</script></body></html>
